<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="m-style-cadastro.css" />
</head>

<body>
    
    <nav class="menu">
        <a class="link" href="index.html">Home</a>
        <a class="link" href="i-galeria.html">Galeria</a>
        <a class="link" href="i-chat.html">Chat</a>
        <a class="link" href="i-login.html">Log-in</a>
        <a class="link" href="i-cadastro.html">Cadastro</a>
    </nav>
    
    <div class="conteiner-cadastro">
        <div class="conteiner-ch1">
            <h2>Cadastro</h2><br>
        </div>

        <div class="cadastro-envio">
            <label for="cadUsuario">Nome de Usuário</label><br>
            <input type="text" id="cadUsuario" placeholder="Digite seu nome" required><br><br>

            <label for="cadEmail">Email</label><br>
            <input type="email" id="cadEmail" placeholder="Digite seu email" required><br><br>

            <label for="cadSenha">Senha</label><br>
            <input type="password" id="cadSenha" placeholder="Digite sua senha" required><br><br>

            <button id="btnCadastro" >Enviar</button>
            <div id="cadMensagem" class="mensagem"></div>
        </div>
    </div>

    <footer>
        <p>CZR - Copyright</p>
    </footer>

    <script>
        const btnCadastro = document.querySelector('#btnCadastro');
        const cadMensagem = document.querySelector('#cadMensagem');

        btnCadastro.addEventListener('click', async ()=>{
            const usuarioEntrada = document.querySelector('#cadUsuario');
            const emailEntrada = document.querySelector('#cadEmail');
            const senhaEntrada = document.querySelector('#cadSenha');

            const usuario = usuarioEntrada.value;
            const email = emailEntrada.value;
            const senha = senhaEntrada.value;

            if (!usuario || !email || !senha) {
                cadMensagem.innerText = 'Preencha todos os campos antes de enviar!'
                cadMensagem.style.color = 'red';
                return;
            }

            cadMensagem.innerText = 'Dados enviados aguarde 5 segundos...';
            cadMensagem.style.color = 'orange';

            try{
                const respostaBE = await fetch('http://localhost:6700/cadastro', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        usuario: usuario,
                        email: email,
                        senha: senha
                    })
                });

                const dados = await respostaBE.json();

                if(!respostaBE.ok) {
                    cadMensagem.innerText = `${dados.erro}`;
                    cadMensagem.style.color = 'red';
                    return;
                }

                cadMensagem.innerText = `${dados.mensagem}: ${dados.perfil}`;
                cadMensagem.style.color = 'green';
                
                localStorage.setItem('usuarioLogado', usuario);

                usuarioEntrada.value = '';
                emailEntrada.value = '';
                senhaEntrada.value = '';
            }
            catch(erro) {
                console.error('Erro na requisição:', erro);
                cadMensagem.innerText = 'Erro ao conectar com o servidor!!';
                cadMensagem.style.color = 'red';
            }
        });
    </script>
</body>

</html>
